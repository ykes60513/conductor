version: '2.3'

services:

  conductor-server:
    environment:
      - CONFIG_PROP=config-mysql.properties
    image: conductor:server
    container_name: conductor-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
    networks:
      - internal
    ports:
      - 8080:8080
    healthcheck:
      test: [ "CMD", "curl","-I" ,"-XGET", "http://localhost:8080/health" ]
      interval: 60s
      timeout: 30s
      retries: 12
    links:
      - conductor-elasticsearch:es
      - conductor-mariadb:mariadb
    depends_on:
      conductor-elasticsearch:
        condition: service_healthy
      conductor-mariadb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"
  conductor-ui:
    image: conductor:ui
    container_name: conductor-ui
    build: 
      context: ../
      dockerfile: docker/ui/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS}
    networks:
      - internal
    ports:
      - 8127:5000
    environment:
      WF_SERVER: http://conductor-server:8080
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"
  
  conductor-mariadb:
    image: mariadb:10.6.19
    environment:
      MARIADB_ROOT_PASSWORD: 12345
      MARIADB_DATABASE: conductor
      MARIADB_USER: conductor
      MARIADB_PASSWORD: conductor
    volumes:
      - type: volume
        source: conductor_mysql
        target: /var/lib/mysql
    networks:
      - internal
    ports:
      - 3306:3306
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/3306'
      interval: 5s
      timeout: 5s
      retries: 12

  conductor-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.2
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - esdata-conductor:/usr/share/elasticsearch/data
    networks:
      - internal
    ports:
      - 9201:9200
    healthcheck:
      test: curl http://localhost:9200/_cluster/health -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

volumes:
  conductor_mysql:
    driver: local
  esdata-conductor:
    driver: local

networks:
  internal:
